server.address=127.0.0.1
server.port=${PORT:8090}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/sedanji}
spring.datasource.username=${POSTGRES_USER:sedanji}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never
sedanji.admin.username=${ADMIN_USERNAME:admin}
sedanji.admin.password=${ADMIN_PASSWORD}
sedanji.youtube.key=${YOUTUBE_API_KEY:}
sedanji.kakao.key=${KAKAO_REST_API_KEY:}
logging.level.org.springframework.web.client=OFF
logging.level.org.springframework.jdbc.core=INFO
